<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLACKJACK 21 - SUPREME CASINO ARENA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার ব্লকার (ডাবল ব্যালেন্স বক্স জ্যাম এড়াতে style.css দিয়ে হাইড লক করা ভাই ভাই) -->
    <div class="header">
        <div class="brand">
            <div class="class-name">BLACKJACK 21</div>
            <div class="class-game">SUPREME CASINO ARENA</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()"></button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🏟️ ব্ল্যাকজ্যাক ২১ লাইভ কার্ড ডিলিং টেবিল বোর্ড জোন -->
    <div class="board-dealing-zone">
        <!-- ডিলার (DEALER) বক্স জোন -->
        <div class="board-column dealer-bg-glow">
            <div class="column-header-title header-dealer">DEALER (ডিলার) <span id="dealer-score" class="score-badge">0</span></div>
            <div class="cards-display-grid" id="dealer-cards-container"></div>
        </div>

        <!-- প্লেয়ার (PLAYER) বক্স জোন -->
        <div class="board-column player-bg-glow">
            <div class="column-header-title header-player">YOUR HAND (প্লেয়ার) <span id="player-score" class="score-badge">0</span></div>
            <div class="cards-display-grid" id="player-cards-container"></div>
        </div>
    </div>

    <!-- 📢 উইন-লস লাইভ ক্যাসিনো মেসেজ প্যানেল বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">৳৫০০ বা কাস্টম চিপস অ্যামাউন্ট সেট করে DEAL বোতাম চাপুন ওস্তাদ!</span>
    </div>

    <!-- 💸 ব্ল্যাকজ্যাক ২১ অ্যাকশন গেমপ্লে বাটন প্যানেল (HIT / STAND কিলার গেটওয়ে) -->
    <div class="betting-board" id="action-board" style="display: none;">
        <button class="bet-board-btn hit-btn" id="hit-action-btn" onclick="handleBlackjackAction('hit')">
            <span class="board-label">HIT 🃏</span>
            <span class="board-odds">তাস নিন</span>
        </button>

        <button class="bet-board-btn stand-btn" id="stand-action-btn" onclick="handleBlackjackAction('stand')">
            <span class="board-label">STAND 🔒</span>
            <span class="board-odds">লক করুন</span>
        </button>
    </div>

    <!-- 🎛️ নিচের মেইন কন্ট্রোল প্যানেল ফুটার -->
    <div class="footer-controls" id="footer-control-panel">
        <div class="play-section">
            <button class="bet-btn-nav" onclick="adjustBet('minus')">-</button>
            <div style="text-align: center; width: 60px;">
                <div style="font-size: 9px; color: #aaa; font-weight: bold;">STAKE</div>
                <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳50</div>
            </div>
            <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>

            <button class="play-btn" id="spin-btn" onclick="startBlackjackGame()">DEAL</button>
            
            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()"></button>
            </div>
        </div>
    </div>

    <!-- 🔌 [ইন্টারন্যাশনাল সকেট ইঞ্জিন লাইব্রেরি গেটওয়ে] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";

        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50;
        let isGameActive = false;
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;
        let activeGameId = null;

        function adjustBet(action) {
            if (isGameActive) return;
            if (action === 'minus' && currentBet > 50) currentBet -= 50;
            if (action === 'plus' && currentBet < 20000) currentBet += 50;
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        // 🎰 [🎰 ৫৪ গেমের সুপ্রিম ওরিজিনাল রুট ইমেজ সিঙ্ক জাভাস্ক্রিপ্ট ইঞ্জিন ভাই ভাই]
        function renderTableCards(gameData, hideDealerCard = true) {
            const pZone = document.getElementById("player-cards-container");
            const dZone = document.getElementById("dealer-cards-container");

            pZone.innerHTML = "";
            dZone.innerHTML = "";

            // ১. প্লেয়ারের কার্ড সরাসরি গิตহাব রুট থেকে অন ফায়ার লোড চেইন
            gameData.playerCards.forEach(c => {
                const cardDiv = document.createElement("div");
                cardDiv.className = "card-deal-animation-node";
                cardDiv.style.width = "55px"; cardDiv.style.height = "80px";
                cardDiv.innerHTML = `<img src="${c.value}_of_${c.suit.toUpperCase()}.png" style="width:100%;height:100%;object-fit:cover;display:block;" alt="Player Card">`;
                pZone.appendChild(cardDiv);
            });

            // ২. ডিলারের কার্ড লোডিং মেকানিজম (ফ্লিপ হোল কার্ড বর্ম সিঙ্ক)
            gameData.dealerCards.forEach((c, idx) => {
                const cardDiv = document.createElement("div");
                cardDiv.className = "card-deal-animation-node";
                cardDiv.style.width = "55px"; cardDiv.style.height = "80px";
                
                if (idx === 1 && hideDealerCard) {
                    cardDiv.innerHTML = `<img src="card-back.png" style="width:100%;height:100%;object-fit:cover;display:block;" alt="Card Back">`;
                } else {
                    cardDiv.innerHTML = `<img src="${c.value}_of_${c.suit.toUpperCase()}.png" style="width:100%;height:100%;object-fit:cover;display:block;" alt="Dealer Card">`;
                }
                dZone.appendChild(cardDiv);
            });

            document.getElementById("player-score").innerText = gameData.playerScore;
            document.getElementById("dealer-score").innerText = hideDealerCard ? "?" : gameData.dealerScore;
        }

        async function startBlackjackGame() {
            if (isGameActive) return;
            isGameActive = true;
            
            document.getElementById("spin-btn").disabled = true;
            document.getElementById("footer-control-panel").style.opacity = "0.5";
            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🎰 ডিলার কার্ড ডিল করছে...";
            playAudio('click');

            try {
                const response = await fetch(`${SERVER_URL}/api/blackjack-start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet,
                        game: "blackjack21" // লবির সাথে ১০০% নিখুঁত শর্টকোড লক
                    })
                });

                const resData = await response.json();
                
                if (resData.success) {
                    activeGameId = resData.gameId;
                    balance = parseFloat(resData.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");

                    renderTableCards(resData.gameData, true);
                    playAudio('spin');

                    // যদি শুরুতে ন্যাচারাল ২১ বা বাস্ট হয়ে যায় তবে একশন বাটন শো করবে না
                    if (resData.gameData.isRoundOver) {
                        showFinalGameReward(resData.gameData.status, resData.gameData.winAmount, resData.gameData.msg, resData.gameData);
                    } else {
                        document.getElementById("action-board").style.display = "flex";
                        document.getElementById("win-text-msg").innerText = "🃏 HIT করবেন নাকি STAND করবেন ওস্তাদ?";
                    }
                } else {
                    alert(resData.message || "❌ Insufficient Balance! Please Recharge Wallet.");
                    resetBlackjackArena();
                }
            } catch (err) {
                console.log("Blackjack Flow Engine Error Bypass.");
                resetBlackjackArena();
            }
        }

        async function handleBlackjackAction(playerAction) {
            if (!isGameActive || !activeGameId) return;
            playAudio('click');

            try {
                const response = await fetch(`${SERVER_URL}/api/blackjack-action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        gameId: activeGameId,
                        userId: urlUserId,
                        action: playerAction,
                        wallet: urlWallet
                    })
                });

                const resData = await response.json();
                if (resData.success) {
                    renderTableCards(resData.gameData, !resData.gameData.isRoundOver);
                    playAudio('spin');

                    if (resData.gameData.isRoundOver) {
                        showFinalGameReward(resData.gameData.status, resData.gameData.winAmount, resData.gameData.msg, resData.gameData);
                    }
                }
            } catch (err) { console.error(err); }
        }

            function showFinalGameReward(status, winAmount, reasonStr) {
        const msgBox = document.getElementById("win-status-box");
        const textMsg = document.getElementById("win-text-msg");
        
        if (status === "win") {
            playAudio('win');
            if (msgBox) msgBox.className = "win-status-container win-glow-bar";
            if (textMsg) textMsg.innerHTML = `🎉 গ্র্যান্ড উইন ওস্তাদ! <b>${reasonStr}</b> - আপনার ওয়ালেটে ৳${winAmount} ক্রেডিট হয়েছে ভাই ভাই!`;
        } else if (status === "push") {
            playAudio('click');
            if (msgBox) msgBox.className = "win-status-container";
            if (textMsg) textMsg.innerHTML = `⧗ পুশ (টেল/ড্র) ওস্তাদ! <b>${reasonStr}</b> - বাজি রিফান্ড করা হয়েছে ভাই ভাই।`;
        } else {
            playAudio('wheel');
            if (msgBox) msgBox.className = "win-status-container lose-glow-bar";
            if (textMsg) textMsg.innerHTML = `💥 ওহ হো বাস্ট! <b>${reasonStr}</b> - এই রাউন্ডে বাজি লস হয়েছে ওস্তাদ!`;
        }

        fetchLiveBalance();
        stopBlackjackState();

        if (isAuto) {
            autoInterval = setTimeout(() => {
                if (isAuto) handleBlackjackDeal();
            }, 3000);
        }
    }

    if (typeof io !== 'undefined') {
        const socket = io();
        socket.on("balanceUpdate", (data) => {
            if (data && data.username === urlUserId) {
                if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                fetchLiveBalance();
            }
        });
    }

    async function fetchLiveBalance() {
        try {
            const response = await fetch(`${SERVER_URL}/api/blackjack-balance?userId=${urlUserId}&wallet=${urlWallet}`);
            const serverData = await response.json();
            if (serverData.success) {
                balance = parseFloat(serverData.balance);
                if (document.getElementById("user-balance")) {
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            }
        } catch (e) { console.error("Blackjack balance sync lag pass"); }
    }

    window.onload = () => {
        if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
        fetchLiveBalance();
    };

    function toggleMute() {
        isMuted = !isMuted;
        const muteEl = document.getElementById("mute-btn");
        if (muteEl) muteEl.innerText = isMuted ? "🔇" : "🔊";
        slotSounds.click.muted = isMuted;
        slotSounds.spin.muted = isMuted;
        slotSounds.win.muted = isMuted;
        slotSounds.wheel.muted = isMuted;
    }

    function toggleAuto() {
        isAuto = !isAuto;
        const autoEl = document.getElementById("auto-btn");
        if (autoEl) autoEl.classList.toggle('active', isAuto);
        if (isAuto && !isSpinning) handleBlackjackDeal();
        playAudio('click');
    }

    function stopBlackjackState() {
        isSpinning = false;
        if (document.getElementById("spin-btn")) document.getElementById("spin-btn").disabled = false;
        if (document.getElementById("hit-btn")) document.getElementById("hit-btn").disabled = true;
        if (document.getElementById("stand-btn")) document.getElementById("stand-btn").disabled = true;
        if (!isAuto && autoInterval) clearTimeout(autoInterval);
    }

    // 🎵 [১০০% ওরিজিনাল প্রিমিয়াম ক্যাসিনো অডিও এবং বাফার প্লেয়ার মডিউল ভাই ভাই]
    const slotSounds = {
        click: new Audio('click2.mp3'),
        spin: new Audio('spin2.mp3'),
        win: new Audio('win2.mp3'),
        wheel: new Audio('wheel1.mp3')
    };
    Object.values(slotSounds).forEach(s => s.load());

    function playAudio(type) {
        if (isMuted) return;
        try {
            slotSounds[type].currentTime = 0;
            slotSounds[type].play();
        } catch(e) {}
    }
</script>
</body>
</html>
