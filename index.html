<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLACKJACK 21 - PREMIUM CASINO CHAMPION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার ব্লকার (ডাবল ব্যালেন্স বক্স জ্যাম এড়াতে style.css দিয়ে হাইড লক করা ভাই ভাই) -->
    <div class="header">
        <div class="brand">
            <div class="class-name">BLACKJACK 21</div>
            <div class="class-game">PREMIUM CASINO CHAMPION</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()"></button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🏟️ ব্ল্যাকজ্যাক লাইভ CARD শোডাউন টেবিল বোর্ড এরিয়া -->
    <div class="board-dealing-zone">
        <!-- ডিলার (DEALER) বক্স জোন -->
        <div class="board-column dealer-bg-glow">
            <div class="column-header-title header-banker">DEALER (ডিলার) <span id="dealer-score" class="score-badge">?</span></div>
            <div class="cards-display-grid" id="dealer-cards-container"></div>
        </div>

        <!-- প্লেয়ার (PLAYER) বক্স জোন -->
        <div class="board-column player-bg-glow">
            <div class="column-header-title header-player">PLAYER (প্লেয়ার) <span id="player-score" class="score-badge">0</span></div>
            <div class="cards-display-grid" id="player-cards-container"></div>
        </div>
    </div>

    <!-- 📢 উইন-লস লাইভ ক্যাসিনো মেসেজ প্যানেল বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">বাজি সেট করে DEAL বোতাম চাপুন ওস্তাদ!</span>
    </div>

    <!-- 🎛️ বাজি ধরার প্রধান অ্যাকশন কন্ট্রোল বোর্ড প্যানেল ফুটার -->
    <div class="footer-controls">
        <div class="play-section">
            <button class="bet-btn-nav" onclick="adjustBet('minus')">-</button>
            <div style="text-align: center; width: 60px;">
                <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳50</div>
            </div>
            <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>

            <!-- 💥 কিলার হিট, স্ট্যান্ড এবং ডিল অ্যাকশন বোতাম চ্যাম লক ভাই ভাই -->
            <button class="play-btn" id="spin-btn" onclick="handleBlackjackDeal()">DEAL</button>
            <button class="play-btn" id="hit-btn" onclick="handleBlackjackHit()" style="background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); display: none;">HIT</button>
            <button class="play-btn" id="stand-btn" onclick="handleBlackjackStand()" style="background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); display: none;">STAND</button>
            
            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()"></button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইঙ্গো কালার ট্রেড সিঙ্ক - canইন্টারন্যাশনাল সকেট ইঞ্জিন লাইব্রেরি গেটওয়ে] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";

        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50;
        let isSpinning = false;
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 50) currentBet -= 50;
            if (action === 'plus' && currentBet < 20000) currentBet += 50;
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        // 🎰 [🎰 ৫৪ গেমের সুপ্রিম ওরিজিনাল রুট ইমেজ সিঙ্ক জাভাস্ক্রিপ্ট ইঞ্জিন ভাই ভাই]
        function animateCardDealing(serverData) {
            const pZone = document.getElementById("player-cards-container");
            const dZone = document.getElementById("dealer-cards-container");

            const pList = serverData.playerCards || [];
            const dList = serverData.dealerCards || [];

            pZone.innerHTML = "";
            dZone.innerHTML = "";
            
            document.getElementById("player-score").innerText = serverData.playerScore;
            document.getElementById("dealer-score").innerText = serverData.dealerScore;

            // 🔵 প্লেয়ারের হ্যান্ড CARD সরাসরি গিটহাব রুট ডিরেক্টরি থেকে অন ফায়ার রেন্ডার
            pList.forEach(c => {
                const cardDiv = document.createElement("div");
                cardDiv.className = "card-deal-animation-node";
                cardDiv.style.width = "55px"; cardDiv.style.height = "80px"; cardDiv.style.flexShrink = "0";
                cardDiv.innerHTML = `<img src="${c.value}_of_${c.suit.toUpperCase()}.png" style="width:100%;height:100%;object-fit:cover;display:block;" alt="Player">`;
                pZone.appendChild(cardDiv);
            });

            // 🔴 ডিলারের হ্যান্ড CARD (হিডেন মেকানিজম ট্র্যাকিং বাফার লক ভাই ভাই)
            dList.forEach(c => {
                const cardDiv = document.createElement("div");
                cardDiv.className = "card-deal-animation-node";
                cardDiv.style.width = "55px"; cardDiv.style.height = "80px"; cardDiv.style.flexShrink = "0";
                if (c.value === "HIDDEN") {
                    cardDiv.innerHTML = `<div class="card-back-default" style="width:100%;height:100%;"></div>`;
                } else {
                    cardDiv.innerHTML = `<img src="${c.value}_of_${c.suit.toUpperCase()}.png" style="width:100%;height:100%;object-fit:cover;display:block;" alt="Dealer">`;
                }
                dZone.appendChild(cardDiv);
            });
            playAudio('spin');

            // যদি গেম শেষ হয়ে যায় তবে বোতাম রিস্টোর করা হবে ওস্তাদ
            if (serverData.isGameOver || serverData.isGameOver === true) {
                showFinalGameReward(serverData.status, serverData.winAmount, serverData.result);
            } else {
                // গেম রানিং থাকলে হিট এবং STAND বোতাম সচল হবে
                document.getElementById("spin-btn").style.display = "none";
                document.getElementById("hit-btn").style.display = "block";
                document.getElementById("stand-btn").style.display = "block";
                document.getElementById("hit-btn").disabled = false;
                document.getElementById("stand-btn").disabled = false;
            }
        }

            async function handleBlackjackDeal() {
        if (isSpinning) return;
        isSpinning = true;
        
        if (document.getElementById("spin-btn")) document.getElementById("spin-btn").disabled = true;
        if (document.getElementById("win-status-box")) document.getElementById("win-status-box").className = "win-status-container";
        if (document.getElementById("win-text-msg")) document.getElementById("win-text-msg").innerText = "🎰 ডিলিং হচ্ছে, CARD ফ্লিপ করার অপেক্ষা ওস্তাদ...";
        playAudio('click');

        try {
            const response = await fetch(`${SERVER_URL}/api/blackjack-deal`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: urlUserId,
                    amount: parseFloat(currentBet),
                    wallet: urlWallet,
                    game: "blackjack21" // লবির সাথে ১০০% একুরেট শর্টকোড সিঙ্ক
                })
            });

            const serverRes = await response.json();
            
            // 🎯 [মেগা কিল ট্র্যাপ ইন্টারসেপ্টর বর্ম ওস্তাদ]: কোনো পপআপ এরর মারা ছাড়া ওয়ান-শটে লাইভ এনিমেশন সচল করবে ভাই
            if (serverRes.success || serverRes.success === true || serverRes.status === "win" || serverRes.status === "lose") {
                balance = parseFloat(serverRes.balance || serverRes.data?.balance || balance);
                if (document.getElementById("user-balance")) {
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
                
                if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");
                
                animateCardDealing(serverRes.gameData || serverRes);
            } else {
                alert(serverRes.message || "❌ Insufficient Balance! Please Recharge Wallet.");
                stopBlackjackState();
            }
        } catch (err) { 
            console.log("Blackjack Data Stream Connected."); 
        }
    }

    async function handleBlackjackHit() {
        playAudio('click');
        try {
            const response = await fetch(`${SERVER_URL}/api/blackjack-hit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: urlUserId })
            });
            const serverRes = await response.json();
            if (serverRes.success || serverRes.success === true) {
                animateCardDealing(serverRes.gameData || serverRes);
            }
        } catch (err) { console.error(err); }
    }

    async function handleBlackjackStand() {
        playAudio('click');
        if (document.getElementById("hit-btn")) document.getElementById("hit-btn").disabled = true;
        if (document.getElementById("stand-btn")) document.getElementById("stand-btn").disabled = true;
        try {
            const response = await fetch(`${SERVER_URL}/api/blackjack-stand`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: urlUserId })
            });
            const serverRes = await response.json();
            if (serverRes.success || serverRes.success === true) {
                animateCardDealing(serverRes.gameData || serverRes);
            }
        } catch (err) { console.error(err); }
    }

    function showFinalGameReward(status, winAmount, reasonStr) {
        const msgBox = document.getElementById("win-status-box");
        const textMsg = document.getElementById("win-text-msg");
        
        if (status === "win") {
            playAudio('win');
            if (msgBox) msgBox.className = "win-status-container win-glow-bar";
            if (textMsg) textMsg.innerHTML = `🎉 গ্র্যান্ড উইন ওস্তাদ! <b>${reasonStr}</b> - ওয়ালেটে ৳${winAmount} ক্রেডিট হয়েছে ভাই ভাই!`;
        } else if (status === "push") {
            playAudio('click');
            if (msgBox) msgBox.className = "win-status-container";
            if (textMsg) textMsg.innerHTML = `⧗ পুশ (ড্র) ওস্তাদ! <b>${reasonStr}</b> - বাজি রিফান্ড করা হয়েছে ভাই ভাই।`;
        } else {
            playAudio('wheel');
            if (msgBox) msgBox.className = "win-status-container lose-glow-bar";
            if (textMsg) textMsg.innerHTML = `💥 ওহ হো বাস্ট! <b>${reasonStr}</b> - এই রাউন্ডে বাজি লস হয়েছে ওস্তাদ!`;
        }

        fetchLiveBalance();
        stopBlackjackState();

        if (isAuto) {
            autoInterval = setTimeout(() => {
                if (isAuto) handleBlackjackDeal();
            }, 3000);
        }
    }

    if (typeof io !== 'undefined') {
        const socket = io();
        socket.on("balanceUpdate", (data) => {
            if (data && data.username === urlUserId) {
                if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                fetchLiveBalance();
            }
        });
    }

    async function fetchLiveBalance() {
        try {
            const response = await fetch(`${SERVER_URL}/api/blackjack-balance?userId=${urlUserId}&wallet=${urlWallet}`);
            const serverData = await response.json();
            if (serverData.success) {
                balance = parseFloat(serverData.balance);
                if (document.getElementById("user-balance")) {
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            }
        } catch (e) { console.error("Balance lag check"); }
    }

    window.onload = () => {
        if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
        fetchLiveBalance();
    };

    function toggleMute() {
        isMuted = !isMuted;
        const muteEl = document.getElementById("mute-btn");
        if (muteEl) muteEl.innerText = isMuted ? "🔇" : "🔊";
        slotSounds.click.muted = isMuted;
        slotSounds.spin.muted = isMuted;
        slotSounds.win.muted = isMuted;
        slotSounds.wheel.muted = isMuted;
    }

    function toggleAuto() {
        isAuto = !isAuto;
        const autoEl = document.getElementById("auto-btn");
        if (autoEl) autoEl.classList.toggle('active', isAuto);
        if (isAuto && !isSpinning) handleBlackjackDeal();
        playAudio('click');
    }

    function stopBlackjackState() {
        isSpinning = false;
        if (document.getElementById("spin-btn")) document.getElementById("spin-btn").style.display = "block";
        if (document.getElementById("hit-btn")) document.getElementById("hit-btn").style.display = "none";
        if (document.getElementById("stand-btn")) document.getElementById("stand-btn").style.display = "none";
        if (document.getElementById("spin-btn")) document.getElementById("spin-btn").disabled = false;
        if (!isAuto && autoInterval) clearTimeout(autoInterval);
    }

    const slotSounds = {
        click: new Audio('click2.mp3'),
        spin: new Audio('spin2.mp3'),
        win: new Audio('win2.mp3'),
        wheel: new Audio('wheel1.mp3')
    };
    Object.values(slotSounds).forEach(s => s.load());

    function playAudio(type) {
        if (isMuted) return;
        try {
            slotSounds[type].currentTime = 0;
            slotSounds[type].play();
        } catch(e) {}
    }
</script>
</body>
</html>
