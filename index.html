<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CASINO BLACKJACK 21</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">BLACKJACK 21</div>
            <div class="game">ROYAL CASINO CLUB</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🃏 ডিলার ও প্লেয়ারের লাক্সারি গেমিং টেবিল (ছবি ছাড়া পিউর কোডিং ভাই ভাই) -->
    <div class="table-zone">
        <!-- ১. ডিলারের এরিয়া -->
        <div class="player-section">
            <div class="section-label">DEALER'S HAND <span class="score-tag" id="dealer-score">?</span></div>
            <div class="card-row" id="dealer-cards">
                <div class="empty-card-slot">তাসের জন্য বাজি ধরুন...</div>
            </div>
        </div>

        <!-- ২. প্লেয়ারের এরিয়া -->
        <div class="player-section" style="border-top: 2px dashed #1e2d4a; padding-top: 15px;">
            <div class="card-row" id="player-cards">
                <div class="empty-card-slot">তাসের জন্য বাজি ধরুন...</div>
            </div>
            <div class="section-label">YOUR HAND <span class="score-tag" id="player-score">0</span></div>
        </div>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ নোটিফিকেশন বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">বাজি সিলেক্ট করে DEAL বাটন চাপুন ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া -->
    <div class="footer-controls">
        <!-- ডিলিং অ্যাকশন বোতামসমূহ -->
        <div class="action-btn-row">
            <button class="game-action-btn hit-style" id="hit-btn" onclick="handleAction('hit')" disabled>HIT</button>
            <button class="game-action-btn stand-style" id="stand-btn" onclick="handleAction('stand')" disabled>STAND</button>
        </div>

        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="deal-btn" onclick="handleDeal()">DEAL</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50; 
        let isGameActive = false;
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/blackjack-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
        };

        function adjustBet(action) {
            if (isGameActive) return;
            if (action === 'minus' && currentBet > 10) currentBet -= 10;
            if (action === 'plus' && currentBet < 2000) currentBet += 10;
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
        }

        function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isGameActive) handleDeal();
            playAudio('click');
        }

        async function handleDeal() {
            if (isGameActive) return;

            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🃏 ডিলার তাস বন্টন করছে...";
            
            document.getElementById("player-cards").innerHTML = "";
            document.getElementById("dealer-cards").innerHTML = "";

            isGameActive = true;
            toggleControls(true);
            playAudio('spin'); // 🚀 তাস বন্টনের গড়গড় সাউন্ড লক ভাই ভাই

            try {
                const response = await fetch(`${SERVER_URL}/api/blackjack-deal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                    
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");

                    // প্লেয়ার ও ডিলারের প্রথম হাতের তাস রেন্ডারিং ভাই
                    renderCards("player", data.playerHand);
                    renderCards("dealer", data.dealerHand, true); // ডিলারের একটি তাস ঢাকা থাকবে ভাই ভাই
                    
                    document.getElementById("player-score").innerText = data.playerScore;
                    document.getElementById("dealer-score").innerText = "?";

                    if (data.status === "end") {
                        // যদি শুরুতেই প্লেয়ারের ব্ল্যাকজ্যাক ২১ হয়ে যায় ভাই ভাই
                        setTimeout(() => { showFinalResult(data); }, 1000);
                    } else {
                        document.getElementById("hit-btn").disabled = false;
                        document.getElementById("stand-btn").disabled = false;
                    }

                } else {
                    alert(data.message || "❌ Insufficient Balance!");
                    resetTableState();
                }
            } catch (err) {
                alert("⚠️ সেশন আউট! আবার ডিল চাপুন ভাই।");
                resetTableState();
            }
        }

        async function handleAction(actionType) {
            if (!isGameActive) return;
            playAudio('click');

            try {
                const response = await fetch(`${SERVER_URL}/api/blackjack-action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: urlUserId, action: actionType })
                });

                const data = await response.json();
                if (data && data.success) {
                    renderCards("player", data.playerHand);
                    document.getElementById("player-score").innerText = data.playerScore;

                    if (data.status === "end") {
                        document.getElementById("hit-btn").disabled = true;
                        document.getElementById("stand-btn").disabled = true;
                        
                        // ডিলারের সব তাস ওপেন করে দেওয়া হলো ভাই
                        renderCards("dealer", data.dealerHand, false);
                        document.getElementById("dealer-score").innerText = data.dealerScore;

                        setTimeout(() => { showFinalResult(data); }, 1000);
                    }
                }
            } catch (e) { console.error("Action gateway lag"); }
        }

                // 🎯 [১০ নম্বর গেম রয়েল তাসের ক্রিস্টাল ক্লিয়ার রেন্ডারার ইঞ্জিন ভাই ভাই]
        function renderCards(target, hand, hideSecond) {
            const container = document.getElementById(`${target}-cards`);
            container.innerHTML = ""; // ওল্ড জ্যাম মেমোরি সাফ লক ভাই

            hand.forEach((card, idx) => {
                const cardDiv = document.createElement("div");
                cardDiv.className = "playing-card";

                // ব্ল্যাকজ্যাক রুলস: ডিলারের ২ নম্বর তাসটি শুরুতে প্লেয়ারের কাছে গোপন বা উল্টানো থাকবে ভাই ভাই
                if (hideSecond && idx === 1) {
                    cardDiv.classList.add("card-hidden");
                    cardDiv.innerText = "🎴";
                } else {
                    // তাসের প্রতীক নির্ধারণ (হৃদয় ও রুইতন লাল রঙে ফ্লাশ হবে ভাই ভাই)
                    cardDiv.innerText = `${card.value}${card.suit}`;
                    if (card.suit === "♥️" || card.suit === "♦️") {
                        cardDiv.style.color = "#ea2027";
                    } else {
                        cardDiv.style.color = "#ffffff";
                    }
                }
                container.appendChild(cardDiv);
            });
        }

        // 🎛️ গেম ওভার হওয়ার পর বোতাম ও কন্ট্রোল প্যানেল রিসেট ইঞ্জিন
        function resetGameLayout() {
            isGameActive = false;
            document.getElementById("spin-btn").disabled = false;
            document.getElementById("hit-btn").disabled = true;
            document.getElementById("stand-btn").disabled = true;
            
            // বাজি ধরার প্লাস-মাইনাস বোতামগুলো আবার একটিভ হলো ভাই ভাই
            document.querySelectorAll(".bet-btn-nav").forEach(b => b.disabled = false);
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
        }

        // 🎯 [আপনার রিকোয়ারমেন্ট অনুযায়ী ৫টি প্রিমিয়াম সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),   // 🚀 বাটন ক্লিক
            spin: new Audio('spin2.mp3'),     // 🚀 তাসের ডিল বা টানার গড়গড় শব্দ ভাই
            win: new Audio('win2.mp3'),       // 🚀 প্লেয়ার ২১ হিট করে বাজি জিতলে
            bigwin: new Audio('bigwin1.mp3'), // 🚀 ডিলারের চেয়ে বেশি মাপে মেগা জিতলে
            wheel: new Audio('wheel1.mp3')    // 🚀 টাই বা পুশ (Push) হলে ব্যাকআপ সাউন্ড
        };
        
        // অল-ক্লিন অ디오 মেমোরি ক্যাশ বুস্টার লক ভাই
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { 
            if (isMuted) return; // 🔇 সাউন্ড অফ থাকলে কোনো অ디오 প্লে হবে না ভাই ভাই!
            try { 
                slotSounds[type].currentTime = 0; 
                slotSounds[type].play(); 
            } catch(e){ console.log("Audio waiting player active click"); } 
        }
    </script>
</body>
</html>
